﻿version: '3.8'

services:
  # ASP.NET Core приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EXTERNAL_PORT=5001
    networks:
      - app-network
    ports:
      - "5001:5001"