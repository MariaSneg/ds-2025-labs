version: '3.8'

x-redis-config: &redis-config
  image: redis:latest
  volumes:
    - ./redis/generated/redis.conf:/usr/local/etc/redis/redis.conf
  command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  networks:
    - app-network
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 5s
    retries: 5


services:
  # ASP.NET Core приложение
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5001
      - EXTERNAL_PORT=5001
      - DB_MAIN=redis_main:6379,password=admin123
      - DB_RU=redis_ru:6379,password=admin123
      - DB_EU=redis_eu:6379,password=admin123
      - DB_ASIA=redis_asia:6379,password=admin123
    depends_on:
      - redis_main
      - rabbitmq
    networks:
      - app-network
    ports:
      - "5001:5001"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings:Redis=redis
      - ASPNETCORE_URLS=http://0.0.0.0:5002
      - EXTERNAL_PORT=5002
      - DB_MAIN=redis_main:6379,password=admin123
      - DB_RU=redis_ru:6379,password=admin123
      - DB_EU=redis_eu:6379,password=admin123
      - DB_ASIA=redis_asia:6379,password=admin123
    depends_on:
      - app1
    networks:
      - app-network
    ports:
      - "5002:5002"

  rank_calculator1:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
      - DB_MAIN=redis_main:6379,password=admin123
      - DB_RU=redis_ru:6379,password=admin123
      - DB_EU=redis_eu:6379,password=admin123
      - DB_ASIA=redis_asia:6379,password=admin123
    depends_on:
      redis_main:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app1:
        condition: service_started
    networks:
      - app-network

  rank_calculator2:
    build:
      context: ../RankCalculator
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379,password=admin123
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
      - DB_MAIN=redis_main:6379,password=admin123
      - DB_RU=redis_ru:6379,password=admin123
      - DB_EU=redis_eu:6379,password=admin123
      - DB_ASIA=redis_asia:6379,password=admin123
    depends_on:
      rank_calculator1:
        condition: service_started
    networks:
      - app-network

  events_logger1:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
    depends_on:
      rank_calculator2:
        condition: service_started
    networks:
      - app-network

  events_logger2:
    build:
      context: ../EventsLogger
      dockerfile: Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__RabbitMQ=amqp://admin:123@rabbitmq:5672
    depends_on:
      events_logger1:
        condition: service_started
    networks:
      - app-network

  # Redis
  redis_main:
    image: redis:latest
    container_name: redis_main
    <<: *redis-config
    ports:
      - "6000:6379"

  redis_ru:
    image: redis:latest
    container_name: redis_ru
    <<: *redis-config
    ports:
      - "6001:6379"
    depends_on:
      redis_main:
        condition: service_started

  redis_eu:
    image: redis:latest
    container_name: redis_eu
    <<: *redis-config
    ports:
      - "6002:6379"
    depends_on:
      redis_main:
        condition: service_started

  redis_asia:
    image: redis:latest
    container_name: redis_asia
    <<: *redis-config
    ports:
      - "6003:6379"
    depends_on:
      redis_main:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672"  # Web UI
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
    networks:
      - app-network

# Сеть для связи между контейнерами
networks:
  app-network:
    driver: bridge